name: Gerar SVGs do README

on:
  schedule: # todo dia, para atualizar as estatísticas do GitHub
    - cron: "17 6 * * *"
  push: # qualquer branch, para a prévia de um branch já sair com os dados
    paths: ["scripts/**", ".github/workflows/readme-assets.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Duas execuções no mesmo branch tentariam dar push ao mesmo tempo
concurrency:
  group: readme-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Sem actions de terceiros: só git e o Node que já vem no runner
      - name: Checkout
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" .

      - run: npm ci && npm run generate
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit se algo mudou
        run: |
          git add assets
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza SVGs do README"
          git push
